server:
  port: 8084

spring:
  data:
    mongodb:
      uri: mongodb://${bank.mongo.host:localhost}:27017/bank_transaction?directConnection=true

bank:
  # P2 (2.3): el host es el nombre del servicio en Eureka (LoadBalancerConfig de cada servicio).
  clients:
    account-service:
      base-url: http://account-service/api/v1

transaction:
  recovery:
    pending-minutes: 2
    cron: "0 * * * * *"

transfer:
  compensation:
    max-attempts: 5

resilience4j:
  circuitbreaker:
    instances:
      account-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      account-service:
        timeout-duration: 2s
        cancel-running-future: true
