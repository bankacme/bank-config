server:
  port: 8082

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_customer?directConnection=true

bank:
  clients:
    customer-service:
      base-url: http://customer-service/api/v1
    credit-service:
      base-url: http://credit-service/api/v1

resilience4j:
  circuitbreaker:
    instances:
      customer-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
      credit-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      customer-service:
        timeout-duration: 2s
        cancel-running-future: true
      credit-service:
        timeout-duration: 2s
        cancel-running-future: true