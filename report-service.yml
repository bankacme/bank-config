server:
  port: 8085

# P2 (paso 2.6): sin base de datos. Todo se consulta por REST a los servicios dueños y se calcula
# en memoria (data-model §3). En P3 report.source=readmodel activa el read model de Mongo.
report:
  source: rest
  max-range-days: 366
  max-movements: 5000
  page:
    max-size: 100
  last-movements:
    max: 50

bank:
  clients:
    account-service:
      base-url: http://account-service/api/v1
    credit-service:
      base-url: http://credit-service/api/v1
    transaction-service:
      base-url: http://transaction-service/api/v1

resilience4j:
  circuitbreaker:
    instances:
      account-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
      credit-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
      transaction-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      account-service:
        timeout-duration: 2s
        cancel-running-future: true
      credit-service:
        timeout-duration: 2s
        cancel-running-future: true
      transaction-service:
        timeout-duration: 2s
        cancel-running-future: true
