bank:
  zone: America/Lima

security:
  enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # El estado en Eureka sigue al /actuator/health del servicio (healthcheck.enabled).
  # Redis es solo caché: si cae, el servicio no debe salir del registro. Mongo sí cuenta.
  health:
    redis:
      enabled: false

# Cliente de Eureka (P2, paso 2.1). eureka-server.yml sobrescribe lo que no aplica al servidor.
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
    # Los servicios son WebFlux: transporte con WebClient en vez de RestTemplate.
    webclient:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
